<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241546"/>
      <stop offset="100%" stop-color="#160d2c"/>
    </linearGradient>
  </defs>

  <!-- badge shape: hexagon, deliberately NOT the Nintendo pill/oval -->
  <polygon points="120,10 520,10 610,110 520,210 120,210 30,110"
           fill="url(#bg)" stroke="#e53946" stroke-width="8"/>

  <!-- decorative pixel dots -->
  <rect x="55" y="45" width="12" height="12" fill="#e53946"/>
  <rect x="80" y="30" width="12" height="12" fill="#ffb703"/>
  <rect x="560" y="45" width="12" height="12" fill="#e53946"/>
  <rect x="535" y="30" width="12" height="12" fill="#3ecf8e"/>
  <rect x="55" y="165" width="12" height="12" fill="#3ecf8e"/>
  <rect x="560" y="165" width="12" height="12" fill="#e53946"/>

  <!-- simple D-pad icon (generic controller cross) -->
  <g transform="translate(90,148)">
    <rect x="0" y="12" width="36" height="12" rx="2" fill="#ffffff"/>
    <rect x="12" y="0" width="12" height="36" rx="2" fill="#ffffff"/>
  </g>

  <!-- simple two-button icon on the other side -->
  <g transform="translate(500,148)">
    <circle cx="8" cy="18" r="9" fill="#e53946"/>
    <circle cx="30" cy="8" r="9" fill="#ffb703"/>
  </g>

  <!-- wordmark, vertically centered now that subtitle is gone -->
  <text x="320" y="128" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="68" letter-spacing="2" fill="#e53946"
        stroke="#ffffff" stroke-width="2" paint-order="stroke">MINDENDO</text>
</svg>
