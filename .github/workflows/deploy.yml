name: Build és publikálás GitHub Pages-re

# Minden main branch-re történő push után újra lefordítja az Eleventy
# oldalt, és publikálja a dist/ mappa tartalmát GitHub Pages-re. A repó
# Settings > Pages > Source alatt "GitHub Actions"-re kell állítani, hogy ez
# a workflow legyen a publikálás forrása (ld. auth-proxy melletti fő
# README/útmutató a pontos lépésekhez).

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  schedule:
    # Nagyjából kéthetente (a hónap 1. és 15. napján, 03:00 UTC-kor) újraépíti
    # és újra publikálja az oldalt akkor is, ha közben senki nem szerkesztett
    # semmit. Ez kell ahhoz, hogy a "hamarosan érkezik" doboz automatikusan
    # eltüntesse azokat a tételeket, amiknek időközben elmúlt a megjelenési
    # dátuma (ez a szűrés build-időben fut le, statikus oldalnál push/ütemezés
    # nélkül nem frissülne magától). A cron nem támogat pontosan "14 naponta"
    # ütemezést, ezért ez a szokásos "kéthavonta kétszer" közelítés.
    - cron: "0 3 1,15 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Függőségek telepítése
        run: npm ci

      - name: Közelgő Switch-megjelenések keresése (csak ütemezve/manuálisan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-upcoming-releases.js
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}

      - name: "hamarosan.json változás commitolása, ha volt új/lejárt tétel"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- _data/hamarosan.json; then
            git config user.name "mindendo-bot"
            git config user.email "actions@github.com"
            git add _data/hamarosan.json
            git commit -m "Hamarosan érkezik lista automatikus frissítése"
            git push
          else
            echo "Nincs változás a hamarosan.json-ban."
          fi

      - name: Eleventy build
        run: npm run build
        env:
          # Ha a build-időben szeretnéd élesben is használni a RAWG API-t,
          # állítsd be a RAWG_API_KEY repó secretet (Settings > Secrets and
          # variables > Actions), különben a badge csendben kimarad.
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}

      - name: Pages előkészítése
        uses: actions/configure-pages@v5

      - name: dist/ feltöltése Pages artifactként
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikálás GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
